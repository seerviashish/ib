<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interview Books</title>
    <meta
      name="description"
      content="Architecture and senior-level interview books — Java, cloud, databases, frameworks and design patterns."
    />
    <!-- Content is paid; keep it out of search indexes and archives. -->
    <meta name="robots" content="noarchive, nosnippet, max-snippet:0" />

    <!--
      iOS ignores the web app manifest's icons entirely and reads this instead,
      so "Add to Home Screen" on an iPhone shows a screenshot of the page
      without it. The manifest link and theme-color are injected by VitePWA;
      only the Apple-specific tags have to be written by hand.
    -->
    <!--
      Favicons. Without these the browser asks for /favicon.ico, and this SPA
      answers every unknown path with index.html — so the tab icon was a 200
      response containing HTML, which browsers quietly discard, leaving the
      blank default.

      SVG first: a tab is drawn at 16, 32 or 48 device pixels depending on the
      display, and one vector is sharp at all three where a bitmap is resampled
      at two of them. The PNGs are the fallback for anything that ignores it.

      `/ib/`, not a relative path. This is an SPA served from one
      index.html at any depth, so `icons/…` would resolve against the CURRENT
      route — `/ib/languages/java/icons/…` — and 404 for every reader who did
      not arrive at the root. Vite substitutes the configured base at build
      time. (The manifest's own icon paths stay relative on purpose: those
      resolve against the manifest URL, which is always at the base.)
    -->
    <link rel="icon" type="image/svg+xml" href="/ib/icons/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/ib/icons/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/ib/icons/favicon-16.png"
    />
    <link rel="apple-touch-icon" href="/ib/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Interview Books" />
    <!-- `black-translucent` would run the page under the status bar, which
         overlaps the app bar. `black` keeps the bar its own strip. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <link rel="stylesheet" crossorigin href="/ib/assets/index-2KaD0GYB.css" integrity="sha384-2+LHhVPYAzH7tBu0kC1Q2+iwdXMkwzrFvTxa2s3Qou4AU87TsmChSCoiNfe9iUZb">
